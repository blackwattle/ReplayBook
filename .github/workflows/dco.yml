name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Every commit in a pull request carries a Signed-off-by line (CONTRIBUTING.md).
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line; see CONTRIBUTING.md (git commit -s)"
              missing=1
            fi
          done
          exit $missing
