[project]
name = "replaybook"
version = "0.1.0"
description = "Tests ops agents against a team's own past tickets in a mock environment before they are trusted with production."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Replaybook contributors" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Real model calls. Offline mode (templates, rules, scripted agent) needs none of this.
models = ["litellm>=1.40"]
# Local embeddings and clustering, used only by discovery and optional failure-group merging.
similarity = ["fastembed>=0.3", "scikit-learn>=1.5"]
jira = [
    "pymongo>=4.6",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
replaybook = "replaybook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replaybook"]

[dependency-groups]
dev = [
    "pymongo>=4.6",
    "pytest>=8.0",
    "ruff>=0.6",
]
sbom = [
    "cyclonedx-bom>=7.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML and CSS template strings read better unwrapped.
"src/replaybook/eval/evidence.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
